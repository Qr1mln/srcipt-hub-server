<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ZJM Server{% endblock %}</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 40px 16px;
            min-height: 100vh;
            font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
        }
        .card {
            width: min(680px, 100%);
            margin: 0 auto;
            padding: 32px 30px 26px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.97);
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.25);
        }
        h1 { margin: 0 0 6px; font-size: 26px; color: #1e293b; }
        .subtitle { margin: 0 0 22px; font-size: 13px; color: #64748b; }
        .form-row { display: flex; gap: 10px; flex-wrap: wrap; }
        input {
            flex: 1 1 140px;
            min-width: 0;
            padding: 11px 14px;
            font-size: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
        }
        input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15); }
        button {
            padding: 11px 22px;
            font-size: 15px;
            color: #fff;
            background: #6366f1;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        button:hover { background: #4f46e5; }
        button:disabled { background: #a5b4fc; cursor: not-allowed; }
        .tip { min-height: 20px; margin: 12px 0 6px; font-size: 13px; color: #64748b; }
        .tip.ok { color: #16a34a; }
        .tip.err { color: #dc2626; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: 0.04em; }
        tbody tr:hover { background: #f8fafc; }
        td.key { font-family: Consolas, "Courier New", monospace; color: #4f46e5; }
        .table-wrap { max-height: 46vh; overflow: auto; }
        td.actions { white-space: nowrap; text-align: right; }
        .mini {
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 7px;
            background: #eef2ff;
            color: #4f46e5;
        }
        .mini:hover { background: #e0e7ff; }
        .mini.danger { background: #fee2e2; color: #dc2626; }
        .mini.danger:hover { background: #fecaca; }
        .mini.ghost { background: #f1f5f9; color: #475569; }
        .mini.ghost:hover { background: #e2e8f0; }
        tr.editing td { background: #f8fafc; }
        tr.editing input { width: 100%; padding: 6px 9px; font-size: 13px; border-radius: 8px; }
        .links { margin-top: 18px; font-size: 13px; color: #94a3b8; }
        .links a { color: #6366f1; text-decoration: none; }
        .nav { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; font-size: 13px; color: #94a3b8; }
        .nav a { color: #6366f1; text-decoration: none; }
        h2 { margin: 22px 0 10px; font-size: 16px; color: #334155; }
        .tiles { display: flex; gap: 10px; flex-wrap: wrap; }
        .tile {
            flex: 1 1 140px;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            background: #eef2ff;
            color: #4338ca;
            border: none;
            cursor: pointer;
        }
        .tile:hover { background: #e0e7ff; }
        .tile-danger { background: #fee2e2; color: #b91c1c; }
        .tile-danger:hover { background: #fecaca; }
        td.method { font-family: Consolas, "Courier New", monospace; font-size: 12px; color: #0f766e; white-space: nowrap; }
    </style>
</head>
<body>
<div class="card">
    {% block content %}{% endblock %}
    {% block footer %}{% endblock %}
</div>
{% block scripts %}{% endblock %}
</body>
</html>
