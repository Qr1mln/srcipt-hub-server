{% extends "base.html" %}

{% block title %}ZJM 数据管理{% endblock %}

{% block content %}
    <div class="nav">
        <a href="/">← 返回首页</a>
        <a href="/logout">退出登录</a>
    </div>

    <h1>ZJM 数据管理</h1>
    <p class="subtitle">数据存储于 SQLite（data/zjm.db），支持动态增、改、删</p>

    <div class="form-row">
        <input id="zjm-input" maxlength="32" placeholder="简称，如 qcxs" autocomplete="off">
        <input id="str-input" maxlength="200" placeholder="描述，如 起床洗漱。" autocomplete="off">
        <button id="add-btn">添加</button>
    </div>
    <p id="tip" class="tip"></p>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>#</th>
                <th>zjm</th>
                <th>str</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody id="tbody">
            {% for item in items %}
                <tr>
                    <td>{{ loop.index }}</td>
                    <td class="key">{{ item.zjm }}</td>
                    <td>{{ item.str }}</td>
                    <td class="actions"></td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}

{% block scripts %}
    <script>
        const API = '/api/zjm';
        const tbody = document.getElementById('tbody');
        const tip = document.getElementById('tip');
        const zjmInput = document.getElementById('zjm-input');
        const strInput = document.getElementById('str-input');
        const addBtn = document.getElementById('add-btn');

        let items = [];
        let editingZjm = null;   // 正在编辑的原简称

        function showTip(text, ok) {
            tip.textContent = text;
            tip.className = ok === null ? 'tip' : (ok ? 'tip ok' : 'tip err');
        }

        function cell(value, className) {
            const td = document.createElement('td');
            if (className) td.className = className;
            td.textContent = value;
            return td;
        }

        function inputCell(id, value, maxLength) {
            const td = document.createElement('td');
            const input = document.createElement('input');
            input.id = id;
            input.value = value;
            input.maxLength = maxLength;
            td.appendChild(input);
            return td;
        }

        function miniButton(text, className, handler) {
            const button = document.createElement('button');
            button.className = 'mini ' + className;
            button.textContent = text;
            button.addEventListener('click', handler);
            return button;
        }

        function viewRow(item, index) {
            const tr = document.createElement('tr');
            const actions = document.createElement('td');
            actions.className = 'actions';
            actions.append(
                miniButton('修改', '', () => {
                    editingZjm = item.zjm;
                    render();
                    document.getElementById('edit-zjm').focus();
                }),
                miniButton('删除', 'danger', () => removeItem(item)),
            );
            tr.append(cell(index + 1), cell(item.zjm, 'key'), cell(item.str), actions);
            return tr;
        }

        function editRow(item, index) {
            const tr = document.createElement('tr');
            tr.className = 'editing';
            const actions = document.createElement('td');
            actions.className = 'actions';
            actions.append(
                miniButton('保存', '', () => saveEdit(item)),
                miniButton('取消', 'ghost', () => {
                    editingZjm = null;
                    render();
                }),
            );
            tr.append(
                cell(index + 1),
                inputCell('edit-zjm', item.zjm, 32),
                inputCell('edit-str', item.str, 200),
                actions,
            );
            return tr;
        }

        function render() {
            tbody.innerHTML = '';
            items.forEach((item, index) => {
                tbody.appendChild(item.zjm === editingZjm ? editRow(item, index) : viewRow(item, index));
            });
        }

        async function request(url, options) {
            const response = await fetch(url, options);
            return response.json();
        }

        async function loadItems() {
            try {
                const data = await request(API);
                if (data.code === 200) {
                    items = data.body;
                    render();
                } else {
                    showTip(data.msg, false);
                }
            } catch (error) {
                showTip('加载失败：' + error.message, false);
            }
        }

        async function addItem() {
            const zjm = zjmInput.value.trim();
            const str = strInput.value.trim();
            if (!zjm || !str) {
                showTip('简称和描述都不能为空', false);
                return;
            }
            addBtn.disabled = true;
            try {
                const data = await request(API, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({zjm: zjm, str: str}),
                });
                if (data.code === 200) {
                    zjmInput.value = '';
                    strInput.value = '';
                    zjmInput.focus();
                    await loadItems();
                    showTip('已添加：' + zjm, true);
                } else {
                    showTip(data.msg, false);
                }
            } catch (error) {
                showTip('请求失败：' + error.message, false);
            } finally {
                addBtn.disabled = false;
            }
        }

        async function saveEdit(item) {
            const zjm = document.getElementById('edit-zjm').value.trim();
            const str = document.getElementById('edit-str').value.trim();
            if (!zjm || !str) {
                showTip('简称和描述都不能为空', false);
                return;
            }
            try {
                const data = await request(API + '/' + encodeURIComponent(item.zjm), {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({zjm: zjm, str: str}),
                });
                if (data.code === 200) {
                    editingZjm = null;
                    await loadItems();
                    showTip('已修改：' + zjm, true);
                } else {
                    showTip(data.msg, false);
                }
            } catch (error) {
                showTip('请求失败：' + error.message, false);
            }
        }

        async function removeItem(item) {
            if (!window.confirm('确定删除 ' + item.zjm + ' 吗？')) return;
            try {
                const data = await request(API + '/' + encodeURIComponent(item.zjm), {method: 'DELETE'});
                if (data.code === 200) {
                    editingZjm = null;
                    await loadItems();
                    showTip('已删除：' + item.zjm, true);
                } else {
                    showTip(data.msg, false);
                }
            } catch (error) {
                showTip('请求失败：' + error.message, false);
            }
        }

        addBtn.addEventListener('click', addItem);
        [zjmInput, strInput].forEach((input) => {
            input.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') addItem();
            });
        });

        // 以服务端数据为准，加载完成后重绘（服务端已渲染首屏，避免空白）
        loadItems();
    </script>
{% endblock %}
